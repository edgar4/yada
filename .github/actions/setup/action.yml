name: Setup
description: Node, cached node_modules and optionally Playwright Chromium
inputs:
  browser:
    description: Install Playwright Chromium
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
    - id: modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
    - if: inputs.browser == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - if: inputs.browser == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
