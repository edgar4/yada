name: Pages
on:
  push:
    paths:
      [
        "site/**",
        "docs/**",
        "scripts/check-pages.mjs",
        "scripts/check-seo.mjs",
        "scripts/render-social-card.mjs",
        ".github/workflows/pages.yml",
        "package.json",
        "package-lock.json",
      ]
  pull_request:
    paths:
      [
        "site/**",
        "docs/**",
        "scripts/check-pages.mjs",
        "scripts/check-seo.mjs",
        "scripts/render-social-card.mjs",
        ".github/workflows/pages.yml",
        "package.json",
        "package-lock.json",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p work/site && cp -R site/. work/site/ && cp docs/*.md work/site/
      - uses: actions/jekyll-build-pages@v1
        with:
          source: work/site
          destination: work/pages
      - run: node scripts/check-pages.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-preview
          path: |
            work/pages
            work/home-*.png
            work/docs-*.png
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: work/pages
  deploy:
    needs: pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
