name: Qualify
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to qualify
        required: true
        type: choice
        options: [anthropic, openai, gemini, deepseek]
      model:
        description: Model id
        required: true
        type: string
      runs:
        description: Runs per scenario
        default: "5"
        type: string
      pricing:
        description: Optional inputMicrosPer1k,outputMicrosPer1k
        required: false
        type: string
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    environment: ${{ inputs.provider }}
    env:
      PROVIDER: ${{ inputs.provider }}
      YADA_LLM_MODEL: ${{ inputs.model }}
      RUNS: ${{ inputs.runs }}
      PRICING: ${{ inputs.pricing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run evals
        env:
          YADA_LLM_API_KEY: ${{ secrets.YADA_LLM_API_KEY }}
        run: npm run evals -- --provider "$PROVIDER" --runs "$RUNS" ${PRICING:+--pricing "$PRICING"} --out evals-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-results
          path: evals-results.json
