name: Pages checks
on:
  push:
    paths:
      [
        "docs/**",
        "scripts/check-pages.mjs",
        "scripts/check-seo.mjs",
        "scripts/render-social-card.mjs",
        ".github/workflows/pages-check.yml",
        "package.json",
        "package-lock.json",
      ]
  pull_request:
    paths:
      [
        "docs/**",
        "scripts/check-pages.mjs",
        "scripts/check-seo.mjs",
        "scripts/render-social-card.mjs",
        ".github/workflows/pages-check.yml",
        "package.json",
        "package-lock.json",
      ]
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p work
      - uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: work/pages
      - run: node scripts/check-pages.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-preview
          path: |
            work/pages
            work/home-*.png
            work/docs-*.png
