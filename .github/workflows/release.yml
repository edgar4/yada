name: Release artifacts
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:package
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e 'import p from "./package.json" with {type:"json"}; if(process.env.GITHUB_REF_NAME !== `v${p.version}`) process.exit(1)'
      - run: mkdir artifacts && npm pack --pack-destination artifacts
      - run: cd artifacts && sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: yada-package-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
