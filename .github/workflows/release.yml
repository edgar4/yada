name: Release artifacts
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:package
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e 'import p from "./package.json" with {type:"json"}; if(process.env.GITHUB_REF_NAME !== `v${p.version}`) process.exit(1)'
      - run: mkdir artifacts && npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: yada-package-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci --ignore-scripts
      - run: bun scripts/build-binaries.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: yada-binaries-${{ github.sha }}
          path: |
            dist-bin/*.tar.gz
            dist-bin/*.zip
          if-no-files-found: error
  verify:
    needs: binaries
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, asset: yada-linux-x64.tar.gz }
          - { os: ubuntu-24.04-arm, asset: yada-linux-arm64.tar.gz }
          - { os: macos-latest, asset: yada-darwin-arm64.tar.gz }
          - { os: macos-15-intel, asset: yada-darwin-x64.tar.gz }
          - { os: windows-latest, asset: yada-windows-x64.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yada-binaries-${{ github.sha }}
      - name: Run the binary
        shell: bash
        run: |
          case "${{ matrix.asset }}" in
            *.zip) 7z x -y "${{ matrix.asset }}" >/dev/null; bin=./yada.exe ;;
            *) tar -xzf "${{ matrix.asset }}"; bin=./yada ;;
          esac
          "$bin" --version
          "$bin" --help | grep -q "Usage: yada"
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: cd assets && sha256sum * > SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes ""
          gh release upload "$TAG" assets/* --clobber
