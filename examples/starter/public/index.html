<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Yada</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <script type="module" src="/assets/client.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <div class="bar">
        <a class="brand" href="/" aria-label="Yada home">
          <svg viewBox="0 0 120 120" width="36" height="36" aria-hidden="true">
            <rect width="120" height="120" rx="28" fill="#1F1A3D" />
            <g
              stroke="#FFB547"
              stroke-width="12"
              fill="none"
              stroke-linecap="round"
            >
              <path d="M30 32 Q45 46 60 60" />
              <path d="M90 32 Q75 46 60 60" />
              <path d="M60 60 Q60 75 60 90" />
            </g>
            <circle cx="60" cy="60" r="9" fill="#FFFFFF" />
          </svg>
          yada
        </a>
        <button id="logout" type="button" hidden>Sign out</button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <aside class="hello">
        <svg id="face" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="60" fill="#1F1A3D" />
          <g
            stroke="#FFB547"
            stroke-width="12"
            fill="none"
            stroke-linecap="round"
          >
            <path data-part="l" d="M30 32 Q45 46 60 60" />
            <path data-part="r" d="M90 32 Q75 46 60 60" />
            <path data-part="s" d="M60 60 Q60 75 60 90" />
          </g>
          <circle data-part="d" cx="60" cy="60" r="9" fill="#FFFFFF" />
        </svg>
        <h1>Hi, I’m Yada.</h1>
        <p>Ask a question, explore an idea, or find your next step.</p>
        <p id="status" role="status">Checking your session…</p>
        <p id="error" role="alert"></p>
        <button id="retry" type="button" hidden>Try again</button>
      </aside>
      <div class="stage">
        <section id="login" class="card" aria-labelledby="login-title" hidden>
          <h2 id="login-title">Sign in to chat with Yada</h2>
          <form id="login-form">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
            <button id="login-button" type="submit">Sign in</button>
          </form>
        </section>
        <section id="chat" class="card" aria-label="Chat with Yada" hidden>
          <div id="widget"></div>
        </section>
        <noscript
          ><p>Enable JavaScript to sign in and use your assistant.</p></noscript
        >
      </div>
    </main>
  </body>
</html>
