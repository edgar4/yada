{%- assign asset_version = site.time | date: '%s' -%}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% include seo.html %}
    <meta
      name="theme-color"
      content="#FFFFFF"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12101F"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="{{ '/assets/brand/yada-mark-dark.svg' | relative_url }}"
      type="image/svg+xml"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/site.css' | relative_url }}?v={{ asset_version }}"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/landing.css' | relative_url }}?v={{ asset_version }}"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/docs.css' | relative_url }}?v={{ asset_version }}"
    />
    <script
      src="{{ '/assets/site.js' | relative_url }}?v={{ asset_version }}"
      defer
    ></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a
          class="wordmark"
          href="{{ '/' | relative_url }}"
          aria-label="Yada home"
          ><img
            class="brand-mark"
            src="{{ '/assets/brand/yada-mark-dark.svg' | relative_url }}"
            width="40"
            height="40"
            alt=""
          />yada</a
        >
        <nav aria-label="Main navigation">
          <a href="{{ '/configuration.html' | relative_url }}">Documentation</a>
          <a class="github-link" href="https://github.com/edgar4/yada"
            >GitHub <span aria-hidden="true">↗</span></a
          >
        </nav>
      </div>
    </header>
    {{ content }}
    <footer class="site-footer on-ink">
      <div class="wrap footer-inner">
        <div>
          <a class="footer-brand" href="{{ '/' | relative_url }}"
            ><img
              src="{{ '/assets/brand/yada-mark-dark.svg' | relative_url }}"
              width="44"
              height="44"
              alt=""
            />yada</a
          >
          <p>The TypeScript runtime for in-app AI assistants.</p>
        </div>
        <nav aria-label="Footer navigation">
          <a href="{{ '/configuration.html' | relative_url }}">Read the docs</a
          ><a href="https://github.com/edgar4/yada"
            >View the source <span aria-hidden="true">↗</span></a
          >
        </nav>
      </div>
    </footer>
    <p class="copy-status visually-hidden" role="status" aria-live="polite"></p>
  </body>
</html>
