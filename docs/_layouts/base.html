<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% if page.title %}{{ page.title | escape }} · {% endif %}Yada
    </title>
    <meta
      name="description"
      content="{{ page.description | default: site.description | escape }}"
    />
    <meta name="theme-color" content="#f6f6f1" />
    <link
      rel="icon"
      href="{{ '/assets/favicon.svg' | relative_url }}"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/landing.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/docs.css' | relative_url }}" />
    <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrap">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Yada home"
        ><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span
        >yada<span class="brand-period">.</span></a
      >
      <nav aria-label="Main navigation">
        <a href="{{ '/configuration.html' | relative_url }}">Documentation</a>
        <a class="github-link" href="https://github.com/edgar4/yada"
          >GitHub <span aria-hidden="true">↗</span></a
        >
      </nav>
    </header>
    {{ content }}
    <footer class="site-footer wrap">
      <div>
        <a class="footer-brand" href="{{ '/' | relative_url }}">yada.</a>
        <p>Built to live in your application.</p>
      </div>
      <nav aria-label="Footer navigation">
        <a href="{{ '/configuration.html' | relative_url }}">Read the docs</a
        ><a href="https://github.com/edgar4/yada"
          >View the source <span aria-hidden="true">↗</span></a
        >
      </nav>
    </footer>
    <p class="copy-status visually-hidden" role="status" aria-live="polite"></p>
  </body>
</html>
